services:
  baton:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      BATON_DEMO: "1"
      BATON_SECURE_COOKIE: "0"
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-15}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-offline}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - baton-data:/app/data
    restart: unless-stopped
volumes:
  baton-data:
